[env:esp32-monitor]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor options
monitor_speed = 9600
monitor_filters = default

; Add include directory to library search paths so LVGL can find lv_conf.h
lib_extra_dirs = ${PROJECT_DIR}/include

; Build flags
build_flags = 
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_CONF_PATH=lv_conf.h
    -I${PROJECT_DIR}/include

; Pre-build script to remove Helium assembly files (ARM-specific, incompatible with ESP32/Xtensa)
extra_scripts = pre:extra_script.py

; Library dependencies
lib_deps = 
    lvgl/lvgl@8.3.11
    bodmer/TFT_eSPI@^2.5.43
    ; SD library is built into ESP32 Arduino core, no external library needed

; Upload settings
upload_speed = 921600

[env:esp32-slave]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

; Serial Monitor options
monitor_speed = 9600
monitor_filters = default

; Add include directory to library search paths so LVGL can find lv_conf.h
lib_extra_dirs = ${PROJECT_DIR}/include

; Build flags
build_flags = 
